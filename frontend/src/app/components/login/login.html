<div class="auth-wrapper">
  <div class="auth-card">
    <div class="brand-header">
      <div class="brand-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="20" height="14" x="2" y="5" rx="2"/>
          <line x1="2" x2="22" y1="10" y2="10"/>
        </svg>
      </div>
      <h2>Welcome Back</h2>
      <p class="subtitle">Sign in to manage your finances</p>
    </div>

    <div *ngIf="errorMessage" class="global-error">
      {{ errorMessage }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="usernameOrEmail">Username or Email</label>
        <input
          id="usernameOrEmail"
          type="text"
          formControlName="usernameOrEmail"
          placeholder="Enter username or email"
          autocomplete="username"
        />
        <div class="field-error" *ngIf="loginForm.get('usernameOrEmail')?.touched && loginForm.get('usernameOrEmail')?.invalid">
          Username or Email is required.
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="••••••••"
          autocomplete="current-password"
        />
        <div class="field-error" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
          Password is required.
        </div>
      </div>

      <button type="submit" [disabled]="loginForm.invalid || isLoading" class="submit-btn btn-submit">
        <mat-spinner *ngIf="isLoading" diameter="20" color="accent"></mat-spinner>
        <span *ngIf="!isLoading">Sign In</span>
      </button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a routerLink="/register">Create an account</a>
    </div>
  </div>
</div>
