<div class="auth-wrapper">

  <div class="auth-card">

    <!-- Brand -->
    <div class="brand-header">

      <div class="brand-icon">

        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="28"
          height="28"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect
            width="20"
            height="14"
            x="2"
            y="5"
            rx="2"
          />

          <line
            x1="2"
            x2="22"
            y1="10"
            y2="10"
          />
        </svg>

      </div>

      <h2>Welcome Back</h2>

      <p class="subtitle">
        Sign in to manage your finances
      </p>

    </div>

    <!-- Error -->
    <div
      *ngIf="errorMessage"
      class="alert alert-danger global-error"
      role="alert"
    >
      {{ errorMessage }}
    </div>

    <!-- Login Form -->
    <form
      [formGroup]="loginForm"
      (ngSubmit)="onSubmit()"
    >

      <!-- Username / Email -->
      <div class="mb-3">

        <label
          for="usernameOrEmail"
          class="form-label"
        >
          Username or Email
        </label>

        <input
          id="usernameOrEmail"
          type="text"
          class="form-control"
          formControlName="usernameOrEmail"
          placeholder="Enter username or email"
          autocomplete="username"
        />

        <div
          class="field-error"
          *ngIf="
            loginForm.get('usernameOrEmail')?.touched &&
            loginForm.get('usernameOrEmail')?.invalid
          "
        >
          Username or Email is required.
        </div>

      </div>

      <!-- Password -->
      <div class="mb-3">

        <label
          for="password"
          class="form-label"
        >
          Password
        </label>

        <input
          id="password"
          type="password"
          class="form-control"
          formControlName="password"
          placeholder="••••••••"
          autocomplete="current-password"
        />

        <div
          class="field-error"
          *ngIf="
            loginForm.get('password')?.touched &&
            loginForm.get('password')?.invalid
          "
        >
          Password is required.
        </div>

      </div>

      <!-- Submit -->
      <button
        type="submit"
        class="btn submit-btn btn-submit w-100"
        [disabled]="loginForm.invalid || isLoading"
      >

        <span
          *ngIf="isLoading"
          class="spinner-border spinner-border-sm"
          aria-hidden="true"
        ></span>

        <span *ngIf="isLoading">
          Signing In...
        </span>

        <span *ngIf="!isLoading">
          Sign In
        </span>

      </button>

    </form>

    <!-- Footer -->
    <div class="auth-footer">

      Don't have an account?

      <a routerLink="/register">
        Create an account
      </a>

    </div>

  </div>

</div>
