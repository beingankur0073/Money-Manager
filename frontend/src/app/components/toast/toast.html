<div
  *ngIf="toast$ | async as toast"
  class="toast-container">

  <div
    class="custom-toast"
    [ngClass]="'toast-' + toast.type">

    <div class="toast-icon">

      <span *ngIf="toast.type === 'success'">
        ✓
      </span>

      <span *ngIf="toast.type === 'error'">
        !
      </span>

      <span *ngIf="toast.type === 'warning'">
        ⚠
      </span>

      <span *ngIf="toast.type === 'info'">
        i
      </span>

    </div>

    <div class="toast-message">
      {{ toast.message }}
    </div>

    <button
      type="button"
      class="toast-close"
      (click)="close()">

      &times;

    </button>

  </div>

</div>
